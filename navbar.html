<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>STACKLY Navbar</title>

    <!-- ============ FONTS ============ -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- ============ TAILWIND ============ -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: "#39b6ab",
              sand: "#e7b490",
              accent: "#ff6f1a",
              ink: "#000000",
            },
            fontFamily: {
              display: ['"Plus Jakarta Sans"', "system-ui", "sans-serif"],
              body: ["Inter", "system-ui", "sans-serif"],
            },
          },
        },
      };
    </script>

    <style>
      /* ============================================================
   STACKLY — DESIGN TOKENS
   ============================================================ */
      :root {
        --brand: #39b6ab;
        --sand: #e7b490;
        --accent: #ff6f1a;
        --ink: #000000;

        --clay:
          12px 12px 28px rgba(0, 0, 0, 0.1),
          -12px -12px 28px rgba(255, 255, 255, 0.92);
        --clay-sm:
          6px 6px 16px rgba(0, 0, 0, 0.09),
          -6px -6px 16px rgba(255, 255, 255, 0.95);
      }

      html,
      body {
        margin: 0;
        padding: 0;
        overflow-x: hidden;
        font-family: "Inter", system-ui, sans-serif;
        background-color: #f4f7f6;
      }

      h1,
      h2,
      h3,
      h4,
      h5,
      h6,
      .font-display {
        font-family: "Plus Jakarta Sans", system-ui, sans-serif;
        letter-spacing: -0.02em;
      }

      /* ============================================================
   NAVBAR BASE
   ============================================================ */
      .navbar-container {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 100;
        padding: 1rem;
        transition: all 0.3s ease;
      }

      .navbar-inner {
        max-width: 1280px;
        margin: 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0.75rem 1.25rem;
        background: rgba(255, 255, 255, 0.92);
        -webkit-backdrop-filter: blur(12px);
        backdrop-filter: blur(12px);
        border-radius: 1.25rem;
        box-shadow: var(--clay-sm);
        transition: box-shadow 0.3s ease;
      }

      /* Desktop Links */
      .desktop-nav {
        display: none;
        align-items: center;
        gap: 2rem;
      }

      .nav-link {
        position: relative;
        font-size: 0.85rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: rgba(0, 0, 0, 0.65);
        text-decoration: none;
        transition: color 0.2s ease;
      }

      .nav-link:hover {
        color: var(--brand);
      }

      .nav-link::after {
        content: "";
        position: absolute;
        bottom: -4px;
        left: 0;
        width: 0;
        height: 2px;
        background: var(--brand);
        transition: width 0.3s ease;
        border-radius: 99px;
      }

      .nav-link:hover::after {
        width: 100%;
      }

      /* Login Button */
      .btn-login {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0.6rem 1.5rem;
        border-radius: 12px;
        font-family: "Plus Jakarta Sans", system-ui, sans-serif;
        font-size: 0.75rem;
        font-weight: 800;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: #fff;
        text-decoration: none;
        background: linear-gradient(145deg, #46c4b8, #2ba49b);
        box-shadow:
          4px 4px 12px rgba(57, 182, 171, 0.35),
          -2px -2px 8px rgba(255, 255, 255, 0.9),
          inset 1px 1px 3px rgba(255, 255, 255, 0.4);
        transition: all 0.2s ease;
      }

      .btn-login:hover {
        transform: translateY(-1px);
        box-shadow:
          6px 6px 16px rgba(57, 182, 171, 0.45),
          -2px -2px 8px rgba(255, 255, 255, 0.9),
          inset 1px 1px 3px rgba(255, 255, 255, 0.4);
      }

      /* Hamburger Button */
      .btn-hamburger {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 44px;
        height: 44px;
        border-radius: 12px;
        background: #fff;
        color: var(--ink);
        border: none;
        cursor: pointer;
        box-shadow: var(--clay-sm);
        transition: transform 0.2s ease;
      }
      .btn-hamburger:active {
        transform: scale(0.95);
      }

      @media (min-width: 1024px) {
        .navbar-container {
          padding: 1.5rem 2rem;
        }
        .navbar-inner {
          padding: 1rem 2rem;
          border-radius: 1.5rem;
        }
        .desktop-nav {
          display: flex;
        }
        .btn-hamburger {
          display: none;
        }
      }

      /* ============================================================
   MOBILE FULL-SCREEN MENU
   ============================================================ */
      .mobile-menu-overlay {
        position: fixed;
        inset: 0;
        background: #ffffff;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        padding: 1.5rem;
        opacity: 0;
        pointer-events: none;
        transform: translateY(-20px);
        transition:
          opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1),
          transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        overflow-y: auto;
      }

      .mobile-menu-overlay.is-active {
        opacity: 1;
        pointer-events: auto;
        transform: translateY(0);
      }

      /* Background decoration for mobile menu */
      .mobile-menu-overlay::before {
        content: "";
        position: absolute;
        top: -10%;
        right: -20%;
        width: 70vw;
        height: 70vw;
        border-radius: 50%;
        background: radial-gradient(
          circle,
          rgba(57, 182, 171, 0.12) 0%,
          transparent 70%
        );
        z-index: -1;
        pointer-events: none;
      }

      /* Mobile Header inside overlay */
      .mobile-menu-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
        margin-bottom: 3rem;
      }

      .btn-close-menu {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 44px;
        height: 44px;
        border-radius: 12px;
        background: #f4f7f6;
        color: var(--ink);
        border: none;
        cursor: pointer;
        box-shadow: var(--clay-sm);
        transition: transform 0.2s ease;
      }
      .btn-close-menu:active {
        transform: scale(0.95);
      }

      /* Mobile Links */
      .mobile-nav {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        width: 100%;
      }

      .mobile-nav-link {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 1rem 0;
        font-family: "Plus Jakarta Sans", system-ui, sans-serif;
        font-size: clamp(1.75rem, 6vw, 2.5rem);
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: -0.02em;
        color: var(--ink);
        text-decoration: none;
        border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        transition:
          color 0.2s ease,
          padding-left 0.2s ease;
        opacity: 0;
        transform: translateX(-20px);
      }

      .mobile-menu-overlay.is-active .mobile-nav-link {
        opacity: 1;
        transform: translateX(0);
      }

      /* Staggered animation for links */
      .mobile-menu-overlay.is-active .mobile-nav-link:nth-child(1) {
        transition-delay: 0.05s;
      }
      .mobile-menu-overlay.is-active .mobile-nav-link:nth-child(2) {
        transition-delay: 0.1s;
      }
      .mobile-menu-overlay.is-active .mobile-nav-link:nth-child(3) {
        transition-delay: 0.15s;
      }
      .mobile-menu-overlay.is-active .mobile-nav-link:nth-child(4) {
        transition-delay: 0.2s;
      }
      .mobile-menu-overlay.is-active .mobile-nav-link:nth-child(5) {
        transition-delay: 0.25s;
      }

      .mobile-nav-link:hover,
      .mobile-nav-link:active {
        color: var(--brand);
        padding-left: 0.5rem;
      }

      .mobile-nav-link svg {
        width: 24px;
        height: 24px;
        color: var(--brand);
        opacity: 0.5;
      }

      /* Mobile Footer (Login Button) */
      .mobile-menu-footer {
        margin-top: auto;
        padding-top: 3rem;
        padding-bottom: 2rem;
        display: flex;
        flex-direction: column;
        gap: 1rem;
        opacity: 0;
        transform: translateY(20px);
        transition:
          opacity 0.4s ease,
          transform 0.4s ease;
      }

      .mobile-menu-overlay.is-active .mobile-menu-footer {
        opacity: 1;
        transform: translateY(0);
        transition-delay: 0.3s;
      }

      .btn-mobile-login {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        padding: 1.25rem;
        border-radius: 16px;
        font-family: "Plus Jakarta Sans", system-ui, sans-serif;
        font-size: 1rem;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: #fff;
        text-decoration: none;
        background: linear-gradient(145deg, #ff8540, #ee5f05);
        box-shadow:
          8px 8px 22px rgba(255, 111, 26, 0.35),
          -6px -6px 18px rgba(255, 255, 255, 0.9),
          inset 1px 1px 3px rgba(255, 255, 255, 0.4);
      }

      /* Prevent Body Scroll */
      body.menu-open {
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <!-- ============================================================
     NAVBAR (Fixed to top)
     ============================================================ -->
    <header class="navbar-container">
      <div class="navbar-inner">
        <!-- Logo (User will provide src) -->
        <a href="./index.html" class="flex items-center gap-2 no-underline">
          <img
            src="./assets/logo.webp"
            alt="STACKLY Logo"
            class="h-8 sm:h-12 w-auto object-contain"
          />
        </a>

        <!-- Desktop Navigation -->
        <nav class="desktop-nav">
          <a href="./index.html" class="nav-link">Home</a>
          <a href="./services.html" class="nav-link">Services</a>
          <a href="./about.html" class="nav-link">About</a>
          <a href="./blog.html" class="nav-link">Blog</a>
          <a href="./contact.html" class="nav-link">Contact</a>
        </nav>

        <!-- Right Side (Login & Hamburger) -->
        <div class="flex items-center gap-3">
          <a href="./login.html" class="btn-login hidden lg:inline-flex"
            >Login</a
          >

          <!-- Hamburger SVG Button -->
          <button id="openMenuBtn" class="btn-hamburger" aria-label="Open Menu">
            <svg
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
            >
              <line x1="3" y1="7" x2="21" y2="7"></line>
              <line x1="3" y1="12" x2="21" y2="12"></line>
              <line x1="3" y1="17" x2="21" y2="17"></line>
            </svg>
          </button>
        </div>
      </div>
    </header>

    <!-- ============================================================
     FULL-SCREEN MOBILE MENU
     ============================================================ -->
    <div id="mobileMenu" class="mobile-menu-overlay">
      <!-- Menu Header (Logo + Close X) -->
      <div class="mobile-menu-header">
        <!-- <a href="./index.html" class="flex items-center gap-2 no-underline">
          <img
            src="https://via.placeholder.com/130x35/ffffff/000000?text=STACKLY"
            alt="STACKLY Logo"
            class="h-8 w-auto object-contain"
          />
        </a> -->

        <!-- Close X SVG Button -->
        <button
          id="closeMenuBtn"
          class="btn-close-menu"
          aria-label="Close Menu"
        >
          <svg
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>

      <!-- Mobile Links -->
      <nav class="mobile-nav">
        <a href="./index.html" class="mobile-nav-link">
          Home
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <line x1="5" y1="12" x2="19" y2="12" />
            <polyline points="12 5 19 12 12 19" />
          </svg>
        </a>
        <a href="./services.html" class="mobile-nav-link">
          Services
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <line x1="5" y1="12" x2="19" y2="12" />
            <polyline points="12 5 19 12 12 19" />
          </svg>
        </a>
        <a href="./about.html" class="mobile-nav-link">
          About
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <line x1="5" y1="12" x2="19" y2="12" />
            <polyline points="12 5 19 12 12 19" />
          </svg>
        </a>
        <a href="./blog.html" class="mobile-nav-link">
          Blog
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <line x1="5" y1="12" x2="19" y2="12" />
            <polyline points="12 5 19 12 12 19" />
          </svg>
        </a>
        <a href="./contact.html" class="mobile-nav-link">
          Contact
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <line x1="5" y1="12" x2="19" y2="12" />
            <polyline points="12 5 19 12 12 19" />
          </svg>
        </a>
      </nav>

      <!-- Mobile Footer (Login Button) -->
      <div class="mobile-menu-footer">
        <a href="./login.html" class="btn-mobile-login">Login</a>
      </div>
    </div>

    <!-- ============================================================
     JAVASCRIPT
     ============================================================ -->
    <script>
      (function () {
        "use strict";

        const openMenuBtn = document.getElementById("openMenuBtn");
        const closeMenuBtn = document.getElementById("closeMenuBtn");
        const mobileMenu = document.getElementById("mobileMenu");
        const body = document.body;

        // Open Mobile Menu
        if (openMenuBtn) {
          openMenuBtn.addEventListener("click", () => {
            mobileMenu.classList.add("is-active");
            body.classList.add("menu-open");
          });
        }

        // Close Mobile Menu
        if (closeMenuBtn) {
          closeMenuBtn.addEventListener("click", () => {
            mobileMenu.classList.remove("is-active");
            body.classList.remove("menu-open");
          });
        }

        // Close Menu when clicking a link
        const mobileLinks = document.querySelectorAll(".mobile-nav-link");
        mobileLinks.forEach((link) => {
          link.addEventListener("click", () => {
            mobileMenu.classList.remove("is-active");
            body.classList.remove("menu-open");
          });
        });

        // Optional: Navbar scroll effect
        const navbar = document.querySelector(".navbar-inner");
        window.addEventListener("scroll", () => {
          if (window.scrollY > 20) {
            navbar.style.boxShadow = "0 10px 30px rgba(0,0,0,0.08)";
          } else {
            navbar.style.boxShadow = "var(--clay-sm)";
          }
        });
      })();
    </script>
  </body>
</html>
